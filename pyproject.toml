[project]
name = "course-planner"
version = "0.1.0"
description = "Local course planner for CUHK-Shenzhen SIS"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cuhksz-sis-scraper", "filelock>=3.13,<4"]

[project.scripts]
course-planner = "course_planner.server:main"

[tool.uv.sources]
cuhksz-sis-scraper = { path = "../sis_scrawler", editable = true }

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"
