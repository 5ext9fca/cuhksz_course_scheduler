[project]
name = "course-planner"
version = "0.1.0"
description = "Local course planner for CUHK-Shenzhen SIS"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cuhksz-sis-scraper @ git+https://github.com/5ext9fca/cuhksz_sis_scraper.git@ddd8e4dc6d9a82cdc4034215da3e0f0f3ddc3017", "filelock>=3.13,<4"]

[project.scripts]
course-planner = "course_planner.server:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"
